name: KLC status monitor

# Runs outside the KLC production server, about every 5 minutes (offset from the top of the hour,
# when GitHub's scheduler is busiest and may delay or drop runs).
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert (opens and closes a test issue) instead of a normal check"
        type: boolean
        default: false
      test_second_opinion:
        description: "Test the second look: the first runner records nothing, a second runner does the real check"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: klc-status-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write   # save site/status.json
      issues: write     # open / comment / close outage issues (GitHub emails the owner)
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      second_opinion: ${{ steps.run.outputs.second_opinion }}
    steps:
      # Use the newest status.json, not the commit that was current when this run was queued.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check KLC services and certificates
        id: run
        run: python3 monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
          TEST_SECOND_OPINION: ${{ github.event.inputs.test_second_opinion || 'false' }}

      - name: Save status
        if: steps.run.outputs.written == 'true'
        run: bash save-status.sh "${{ steps.run.outputs.state }}"

  # A second opinion, from another machine at another address. One runner is one place on the internet:
  # twice (24 and 25 Nov 2026) a runner could not connect to the KLC server for a few minutes while the
  # server was answering everybody else, and the owner was emailed "all KLC systems not answering".
  # So when the first runner gets no answer at all from KLC it records nothing (second_opinion=true), and
  # this job does the whole check again. Only what this job sees is recorded and emailed.
  # It is skipped on a normal run. Keep it on ubuntu-latest: that label never goes away, and if this job
  # could not start, a real outage would raise no alert.
  confirm:
    name: Second opinion (another location)
    needs: check
    if: needs.check.outputs.second_opinion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check KLC services and certificates again
        id: run
        run: python3 monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECOND_OPINION: "true"

      - name: Save status
        if: steps.run.outputs.written == 'true'
        run: bash save-status.sh "${{ steps.run.outputs.state }}"

  publish:
    needs: [check, confirm]
    # "confirm" is skipped on a normal run; a skipped job must not stop the page from being published.
    if: ${{ !cancelled() && !failure() && (needs.check.outputs.deploy == 'true' || needs.confirm.outputs.deploy == 'true') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
